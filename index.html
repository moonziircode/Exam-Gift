<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open Your Gift</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Poppins', sans-serif;
        background-color: #1a001a;
        overflow: hidden;
      }
      .font-cormorant {
        font-family: 'Cormorant Garamond', serif;
      }
      .fade-in {
        animation: fadeInAnimation 1.2s ease-in-out forwards;
      }
      .fade-in-slow {
        animation: fadeInAnimation 2s ease-in-out forwards;
      }
       .glow-text {
        animation: glowAnimation 2s ease-in-out infinite alternate;
      }
      @keyframes fadeInAnimation {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
       @keyframes glowAnimation {
        from {
          text-shadow: 0 0 5px #fce7f3, 0 0 10px #fce7f3, 0 0 15px #ffffff;
        }
        to {
          text-shadow: 0 0 10px #fce7f3, 0 0 20px #fbcfe8, 0 0 30px #ffffff;
        }
      }

      /* Animated Background */
      #background-animation {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        background: linear-gradient(135deg, #4c004c, #ff66b2, #ffccff);
        background-size: 400% 400%;
        animation: gradientBG 15s ease infinite;
      }
      @keyframes gradientBG {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      .orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(40px);
        opacity: 0.6;
        animation: float 20s infinite ease-in-out;
      }
      .orb:nth-child(1) {
        width: 200px; height: 200px;
        background: #ec4899;
        top: 10%; left: 5%;
        animation-duration: 15s;
        animation-delay: 0s;
      }
      .orb:nth-child(2) {
        width: 300px; height: 300px;
        background: #f472b6;
        bottom: 5%; right: 10%;
        animation-duration: 25s;
        animation-delay: -5s;
      }
       .orb:nth-child(3) {
        width: 150px; height: 150px;
        background: #f9a8d4;
        bottom: 40%; left: 20%;
        animation-duration: 20s;
        animation-delay: -10s;
      }
       .orb:nth-child(4) {
        width: 250px; height: 250px;
        background: #fbcfe8;
        top: 15%; right: 25%;
        animation-duration: 30s;
        animation-delay: -2s;
      }
      @keyframes float {
        0% { transform: translateY(0px) translateX(0px) scale(1); }
        50% { transform: translateY(-40px) translateX(30px) scale(1.1); }
        100% { transform: translateY(0px) translateX(0px) scale(1); }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/client": "https://aistudiocdn.com/react-dom@^19.2.0/client",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/"
  }
}
</script>
</head>
  <body>
    <div id="background-animation">
      <div class="orb"></div>
      <div class="orb"></div>
      <div class="orb"></div>
      <div class="orb"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
